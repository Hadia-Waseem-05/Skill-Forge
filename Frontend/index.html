<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge - Learning Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="logo">SkillForge</div>
        <ul class="nav-links">
            <li><a href="#catalog">Courses</a></li>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#player">Lesson Player</a></li>
        </ul>
    </nav>

    <!-- 2. Course Catalog Section -->
    <section id="catalog" class="section-container">
        <h2>Course Catalog</h2>
        <div class="course-grid">
            <div class="course-card">
                <h3>Web Development Basics</h3>
                <p>Learn HTML, CSS, JavaScript & Figma</p>
                <button class="btn">View Course</button>
            </div>
        </div>
    </section>

    <!-- 3. Student Dashboard Section -->
    <section id="dashboard" class="section-container">
        <h2>Student Dashboard</h2>
        <div class="progress-box">
            <p>Your Progress: 60%</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
