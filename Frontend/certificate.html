<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillForge - Certificate</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .main-layout {
      display: flex;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }
    .cert-container {
      flex: 1;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 4px 14px rgba(31, 41, 55, 0.08);
    }
    .cert-preview {
      width: 100%;
      height: 500px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #F5F3FF;
    }
    .cert-preview iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .cert-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      justify-content: center;
    }
    .cert-placeholder {
      height: 500px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-direction: column;
      gap: 1rem;
    }
    .cert-info {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .cert-info p { margin: 0.2rem 0; font-size: 0.9rem; }
    .cert-info strong { color: var(--primary); }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="main-layout">
    <main class="cert-container">
      <h1 class="page-title" style="text-align:left;">Certificate of Completion</h1>
      <p class="page-desc" id="cert-course-name">Loading...</p>

      <div id="cert-info-area"></div>

      <div id="cert-preview-area">
        <div class="cert-placeholder">
          <i data-lucide="loader" class="lucide-loader" style="width:48px; height:48px;"></i>
          <p>Generating your certificate...</p>
        </div>
      </div>

      <div class="cert-actions" id="cert-actions" style="display:none;">
        <button class="btn" onclick="downloadCertificatePdf()"><i data-lucide="download"></i> Download PDF</button>
        <button class="btn-secondary" onclick="window.print()"><i data-lucide="print"></i> Print</button>
      </div>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="enrollments.js"></script>
  <script>
    let certificateBlobUrl = null;
    let certificateCourseName = "Course";

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadCertificate() {
      const courseId = getQueryParam("courseId");
      if (!courseId) {
        document.getElementById("cert-preview-area").innerHTML = '<p class="error-text" style="text-align:center; padding:2rem;">No course specified for this certificate.</p>';
        return;
      }

      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      const studentName = localStorage.getItem("name") || "Student";
      document.getElementById("cert-course-name").textContent = "Course: Loading...";

      try {
        const courseData = await getCourseById(courseId);
        certificateCourseName = courseData.course?.title || courseData.title || "Course";
        document.getElementById("cert-course-name").textContent = "Course: " + certificateCourseName;
        document.getElementById("cert-info-area").innerHTML = `
          <div class="cert-info">
            <p><strong>Student:</strong> ${studentName}</p>
            <p><strong>Course:</strong> ${certificateCourseName}</p>
            <p><strong>Date Issued:</strong> ${new Date().toLocaleDateString()}</p>
          </div>
        `;
      } catch (err) {
        document.getElementById("cert-course-name").textContent = "Course: Unknown";
        document.getElementById("cert-info-area").innerHTML = '<p style="color:var(--text-secondary);">Could not load course details, but the certificate will still be generated.</p>';
      }

      try {
        const blob = await downloadCertificatePdfApi(studentName, certificateCourseName, courseId);
        certificateBlobUrl = URL.createObjectURL(blob);
        document.getElementById("cert-preview-area").innerHTML =
          '<div class="cert-preview"><iframe id="cert-iframe" src="' + certificateBlobUrl + '" title="Certificate PDF"></iframe></div>';
        document.getElementById("cert-actions").style.display = "flex";
        if (window.lucide) lucide.createIcons();
      } catch (err) {
        document.getElementById("cert-preview-area").innerHTML =
          '<p class="error-text" style="text-align:center; padding:2rem;">' +
          (err.message || "Failed to generate certificate") + "</p>";
      }
    }

    function downloadCertificatePdf() {
      if (!certificateBlobUrl) return;
      const a = document.createElement("a");
      a.href = certificateBlobUrl;
      const studentName = localStorage.getItem("name") || "student";
      a.download = "certificate-" + studentName.replace(/\s+/g, "_") + ".pdf";
      a.click();
    }

    loadCertificate();
    if (window.lucide) lucide.createIcons();
  </script>

</body>
</html>
