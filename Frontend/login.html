<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="navbar-placeholder"></div>
    <section class="section-container auth-container">
        <div class="card auth-box">
            <h1 style="text-align: center;">Welcome Back!</h1>
            <h2>Login to SkillForge</h2>

            <p id="errorMsg" class="error-text" hidden></p>

            <form id="loginForm">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn block-btn" id="loginBtn">Login</button>
            </form>

            <p class="helper-text">
                <a href="forgot-password.html">Forgot password?</a>
            </p>

            <p class="helper-text">
                Don't have an account? <a href="register.html">Register</a>
            </p>
        </div>
    </section>

    <script src="auth.js"></script>
     <script src="navbar.js"></script>
</body>
</html>
