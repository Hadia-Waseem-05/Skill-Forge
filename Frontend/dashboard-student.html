<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillForge - Student Dashboard</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #334155;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-layout {
      display: flex;
      max-width: 1300px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
      gap: 1.8rem;
      flex: 1;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      position: sticky;
      top: 24px;
      height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
    }
    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .sidebar-menu li button {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: 0.2s;
    }
    .sidebar-menu li button:hover, .sidebar-menu li button.active {
      background: rgba(79, 70, 229, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .sidebar-delete-wrap {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .sidebar-delete-btn {
      width: 100%;
    }

    .sidebar svg { width: 18px; height: 18px; flex-shrink: 0; }
    .content-area svg { width: 16px; height: 16px; vertical-align: middle; }

    .content-area {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    .page-title { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .page-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .stat-card h4 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .stat-card .stat-number { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .card-item {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .btn-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    .progress-bar-bg {
      background: #020617;
      border-radius: 20px;
      height: 8px;
      width: 100%;
      overflow: hidden;
      margin: 0.6rem 0;
    }
    .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 20px; }

    .lesson-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.6rem;
    }
    .lesson-item.active { border-color: var(--accent); }

    .player-window {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .success-text {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      border: 1px solid var(--success);
    }

    .modal-overlay:not([hidden]) {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-box {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    .modal-box h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .modal-box p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-danger {
      background: #DC2626;
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-danger:hover {
      background: #B91C1C;
    }

    @media (max-width: 850px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; position: static; top: auto; height: auto; display: block; }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="main-layout">
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><button id="tab-profile" onclick="setTab('student-profile')"><i data-lucide="user"></i> My Profile</button></li>
        <li><button id="tab-courses" class="active" onclick="setTab('my-courses')"><i data-lucide="book-open"></i> My Courses</button></li>
        <li><button id="tab-progress" onclick="setTab('progress-tracking')"><i data-lucide="bar-chart-2"></i> Progress Tracking</button></li>
        <li><button id="tab-quiz" onclick="setTab('quiz-cert')"><i data-lucide="award"></i> Quiz &amp; Certificates</button></li>
      </ul>

      <div class="sidebar-delete-wrap">
        <button class="btn-danger sidebar-delete-btn" onclick="openDeleteModal()"><i data-lucide="trash-2"></i> Delete Account</button>
      </div>
    </aside>

    <main class="content-area" id="content-view"></main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="enrollments.js"></script>

  <script>
    const ENROLL_API = "http://localhost:5000/api/enrollments/";
    let currentTab = 'my-courses';
    let selectedCourseId = null;
    let selectedLessonId = null;
    let enrolledCourses = [];
    let loading = true;

    async function fetchStudentEnrollments() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      loading = true;
      renderContent();

      try {
        const enrollments = await getMyEnrollments();

        const progressPromises = enrollments.map((e) => {
          const cid = e.course_id?._id || e.course_id;
          return getCourseProgress(cid).catch(() => ({
            percentage: 0,
            completed_lessons: 0,
            total_lessons: 0,
          }));
        });

        const progressResults = await Promise.all(progressPromises);

        enrolledCourses = enrollments.map((item, index) => {
          const course = item.course_id || item.course || item;
          const progress = progressResults[index];
          return {
            id: course._id || course.id,
            title: course.title || "Course Title",
            description: course.description || "",
            thumbnail: course.thumbnail,
            lessons: course.lessons && course.lessons.length > 0 ? course.lessons : [
              { id: 1, title: '1. Course Overview & Introduction', duration: '10 mins', completed: false },
              { id: 2, title: '2. Core Principles & Setup', duration: '20 mins', completed: false },
              { id: 3, title: '3. Hands-on Project Implementation', duration: '35 mins', completed: false }
            ],
            progress: progress.percentage || 0,
            completedLessons: progress.completed_lessons || 0,
            totalLessons: progress.total_lessons || 0,
          };
        });
      } catch (err) {
        console.error("Enrollments fetch failed:", err);
        showError("Failed to load your courses. Please try again.");
      } finally {
        loading = false;
        renderContent();
      }
    }

    function setTab(tab) {
      currentTab = tab;
      selectedCourseId = null;
      document.querySelectorAll('.sidebar-menu button').forEach(b => b.classList.remove('active'));
      if (tab === 'student-profile') document.getElementById('tab-profile').classList.add('active');
      if (tab === 'my-courses') document.getElementById('tab-courses').classList.add('active');
      if (tab === 'progress-tracking') document.getElementById('tab-progress').classList.add('active');
      if (tab === 'quiz-cert') document.getElementById('tab-quiz').classList.add('active');
      renderContent();
    }

    function renderContent() {
      const view = document.getElementById('content-view');

      if (loading && currentTab === 'my-courses') {
        view.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 3rem;">Loading your courses from server...</p>`;
        return;
      }

      if (currentTab === 'student-profile') {
        const username = localStorage.getItem('username') || 'Student';
        const userEmail = localStorage.getItem('email') || 'student@skillforge.com';
        const userId = localStorage.getItem('userId');

        view.innerHTML = `
          <h1 class="page-title">Student Profile</h1>
          <p class="page-desc">Manage your personal profile and learning track preferences.</p>
          <p id="profileSuccess" class="success-text" hidden></p>
          <form onsubmit="handleStudentProfileSave(event)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group"><label>Full Name</label><input type="text" value="${username}" required></div>
              <div class="form-group"><label>Email Address</label><input type="email" value="${userEmail}" required></div>
            </div>
            <div class="form-group"><label>Target Track</label><input type="text" value="Full-Stack Web Engineering"></div>
            <div class="form-group"><label>Bio</label><textarea rows="3">Learning on SkillForge platform.</textarea></div>
            <button type="submit" class="btn-primary">Save Changes</button>
          </form>
        `;
      } else if (currentTab === 'my-courses') {
        if (!enrolledCourses.length) {
          view.innerHTML = `
            <h1 class="page-title">My Enrolled Courses</h1>
            <p class="page-desc">Access your registered learning modules.</p>
            <div class="card-item" style="text-align: center; padding: 3rem 1rem;">
              <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1.2rem;">You are not enrolled in any course yet.</p>
              <a href="courses.html" class="btn-primary">Enroll Now</a>
            </div>
          `;
          return;
        }

        if (!selectedCourseId) {
          view.innerHTML = `
            <h1 class="page-title">My Enrolled Courses</h1>
            <p class="page-desc">Click any course to view curriculum lessons and launch video modules.</p>
            ${enrolledCourses.map(course => {
              const percent = course.progress || 0;
              return `
                <div class="card-item" style="display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                  <div style="flex: 1; min-width: 250px;">
                    <h3 style="font-size: 1.2rem; margin-bottom: 0.3rem;">${course.title}</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.6rem;">${course.description}</p>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%;"></div></div>
                    <span style="font-size: 0.85rem; color: var(--accent);">${course.completedLessons || 0} of ${course.totalLessons || course.lessons.length} Lessons Finished (${percent}%)</span>
                  </div>
                  <button class="btn-primary" onclick="openCourse('${course.id}')">Open Course & Lessons</button>
                </div>
              `;
            }).join('')}
          `;
        } else {
          const course = enrolledCourses.find(c => c.id === selectedCourseId);
          const currentLesson = course.lessons.find(l => l.id === selectedLessonId) || course.lessons[0];

          view.innerHTML = `
            <button class="btn-secondary" onclick="selectedCourseId=null; renderContent();" style="margin-bottom: 1rem;">← Back to Courses</button>
            <h1 class="page-title">${course.title}</h1>
            <p class="page-desc">${course.description}</p>

            <div class="player-window">
              <p style="font-size: 1.2rem; font-weight: 600; color: var(--accent); margin-bottom: 0.4rem;"><i data-lucide="play"></i> Playing: ${currentLesson.title}</p>
              <p style="color: var(--text-muted); font-size: 0.9rem;">Duration: ${currentLesson.duration}</p>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-dark); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1.5rem;">
              <div>
                <strong>Current Lesson:</strong> <span style="color: var(--text-muted);">${currentLesson.title}</span>
                <div style="font-size: 0.85rem; margin-top: 0.2rem; color: ${currentLesson.completed ? 'var(--success)' : 'var(--warning)'};">
                  ${currentLesson.completed ? '<i data-lucide="check-circle"></i> Status: Completed' : '<i data-lucide="clock"></i> Status: In Progress'}
                </div>
              </div>
              <button class="btn-success" onclick="toggleComplete('${course.id}', ${currentLesson.id})">
                ${currentLesson.completed ? '<i data-lucide="check-circle"></i> Completed (Click to Undo)' : '<i data-lucide="check-circle"></i> Mark as Completed'}
              </button>
            </div>

            <h3 style="margin-bottom: 0.8rem;">Curriculum Lessons</h3>
            ${course.lessons.map(l => `
              <div class="lesson-item ${l.id === currentLesson.id ? 'active' : ''}">
                <div>
                  <strong style="color: ${l.id === currentLesson.id ? 'var(--accent)' : 'var(--text-main)'}; cursor: pointer;" onclick="playLesson(${l.id})">${l.title}</strong>
                  <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 0.5rem;">(${l.duration})</span>
                </div>
                <div>
                  ${l.completed ? '<span style="color: var(--success); font-size: 0.85rem; font-weight: 700; margin-right: 0.6rem;"><i data-lucide="check"></i> Done</span>' : ''}
                  <button class="btn-secondary" style="padding: 0.35rem 0.7rem; font-size: 0.8rem;" onclick="playLesson(${l.id})">Play</button>
                </div>
              </div>
            `).join('')}
          `;
        }
      } else if (currentTab === 'progress-tracking') {
        const total = enrolledCourses.reduce((sum, c) => sum + (c.totalLessons || c.lessons.length), 0);
        const done = enrolledCourses.reduce((sum, c) => sum + (c.completedLessons || 0), 0);
        const overall = total > 0 ? Math.round((done / total) * 100) : 0;

        view.innerHTML = `
          <h1 class="page-title">Progress Tracking</h1>
          <p class="page-desc">Overview of your study hours and completed course milestones.</p>
          <div class="stats-grid">
            <div class="stat-card"><h4>Overall Completion</h4><div class="stat-number">${overall}%</div></div>
            <div class="stat-card"><h4>Lessons Finished</h4><div class="stat-number">${done} / ${total}</div></div>
            <div class="stat-card"><h4>Active Courses</h4><div class="stat-number">${enrolledCourses.length}</div></div>
          </div>
          ${enrolledCourses.length ? `
            <h3 style="margin: 1.5rem 0 1rem;">Course Progress Breakdown</h3>
            ${enrolledCourses.map(c => {
              const finished = c.completedLessons || 0;
              const p = c.progress || 0;
              return `
                <div class="card-item">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
                    <strong>${c.title}</strong><span style="color: var(--accent); font-weight: 600;">${p}%</span>
                  </div>
                  <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${p}%;"></div></div>
                  <small style="color: var(--text-muted);">${finished} of ${c.totalLessons || c.lessons.length} lessons finished</small>
                </div>
              `;
            }).join('')}
          ` : '<p style="color:var(--text-muted);">Enroll in a course to view detailed milestone analytics.</p>'}
        `;
      } else if (currentTab === 'quiz-cert') {
        view.innerHTML = `
          <h1 class="page-title">Quizzes & Certifications</h1>
          <p class="page-desc">Complete knowledge checks and claim your verified certificates.</p>
          <div class="card-item" style="display: flex; justify-content: space-between; align-items: center; flex-wrap:wrap; gap:1rem;">
            <div>
              <h4>Course Knowledge Assessment</h4>
              <p style="color: var(--text-muted); font-size: 0.85rem;">10 Questions • 15 Minutes • Passing Score: 80%</p>
            </div>
            <a href="player.html" class="btn-primary">Start Quiz</a>
          </div>
        `;
      }

      if (window.lucide) lucide.createIcons();
    }

    function openCourse(id) { selectedCourseId = id; selectedLessonId = 1; renderContent(); }
    function playLesson(id) { selectedLessonId = id; renderContent(); }
    function toggleComplete(cId, lId) {
      const course = enrolledCourses.find(c => c.id === cId);
      if (course) {
        const lesson = course.lessons.find(l => l.id === lId);
        if (lesson) { lesson.completed = !lesson.completed; renderContent(); }
      }
    }

    function handleStudentProfileSave(e) {
      e.preventDefault();
      const successEl = document.getElementById("profileSuccess");
      successEl.textContent = "Profile updated successfully!";
      successEl.hidden = false;
    }

    function openDeleteModal() {
      document.getElementById("deleteModal").hidden = false;
    }

    function closeDeleteModal() {
      document.getElementById("deleteModal").hidden = true;
    }

    async function confirmDeleteAccount() {
      const userId = localStorage.getItem("userId");
      if (!userId) return;

      try {
        await deleteAccount(userId);
        closeDeleteModal();
        logoutUser();
        window.location.href = "index.html";
      } catch (err) {
        const view = document.getElementById('content-view');
        const errorEl = document.createElement('p');
        errorEl.className = 'error-text';
        errorEl.textContent = err.message || "Failed to delete account.";
        if (view) view.insertBefore(errorEl, view.firstChild);
      }
    }

    function logoutUser() {
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      localStorage.removeItem("userId");
      localStorage.removeItem("name");
      localStorage.removeItem("avatar");
      localStorage.removeItem("username");
      localStorage.removeItem("email");
    }

    fetchStudentEnrollments();
    if (window.lucide) lucide.createIcons();
  </script>

  <div id="deleteModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3>Delete Account</h3>
      <p>This action is permanent and cannot be undone. All your data will be removed.</p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDeleteAccount()">Delete Account</button>
      </div>
    </div>
  </div>

</body>
</html>
