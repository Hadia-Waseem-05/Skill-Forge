<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="navbar-placeholder"></div>
    <section class="section-container auth-container">
        <div class="card auth-box">
            <h1 style="text-align: center;">Forgot Password?</h1>
            <h2>We'll email you a reset link</h2>

            <p id="errorMsg" class="error-text" hidden></p>
            <p id="successMsg" class="success-text" hidden></p>

            <form id="forgotPasswordForm">
                <input type="email" id="email" placeholder="Enter your registered email" required>
                <button type="submit" class="btn block-btn" id="submitBtn">Send Reset Link</button>
            </form>

            <p class="helper-text">
                Remember your password? <a href="login.html">Login</a>
            </p>
        </div>
    </section>

    <script src="auth.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
