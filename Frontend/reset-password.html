<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge - Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="navbar-placeholder"></div>
    <section class="section-container auth-container">
        <div class="card auth-box">
            <h1 style="text-align: center;">Reset Your Password</h1>
            <h2>Enter a new password below</h2>

            <p id="errorMsg" class="error-text" hidden></p>
            <p id="successMsg" class="success-text" hidden></p>

            <form id="resetPasswordForm">
                <input type="password" id="newPassword" placeholder="New Password" required>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
                <button type="submit" class="btn block-btn" id="resetBtn">Reset Password</button>
            </form>

            <p class="helper-text">
                <a href="login.html">Back to Login</a>
            </p>
        </div>
    </section>

    <script src="auth.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
