<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge - Courses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <section class="section-container">
        <h2 class="page-title">Course Catalog</h2>
        <p class="page-subtitle">Browse courses and start learning today.</p>

        <p id="coursesError" class="error-text" hidden></p>
        <p id="enrollSuccess" class="success-text" hidden></p>

        <div class="course-grid" id="courseGrid">
            <div class="course-card skeleton"></div>
            <div class="course-card skeleton"></div>
            <div class="course-card skeleton"></div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script src="enrollments.js"></script>
    <script src="courses.js"></script>

    <div id="enrollModal" class="modal-overlay" hidden>
        <div class="modal-box">
            <h3>Confirm Enrollment</h3>
            <p>Do you really want to enroll in this course?</p>
            <div class="modal-actions">
                <button class="btn-secondary" id="enrollCancelBtn">Cancel</button>
                <button class="btn" id="enrollConfirmBtn">Yes, Enroll</button>
            </div>
        </div>
    </div>
</body>
</html>
