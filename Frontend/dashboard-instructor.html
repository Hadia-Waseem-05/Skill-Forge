<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillForge - Instructor Dashboard</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #334155;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-layout {
      display: flex;
      max-width: 1300px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
      gap: 1.8rem;
      flex: 1;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      height: fit-content;
    }
    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .sidebar-menu li button {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: 0.2s;
    }
    .sidebar-menu li button:hover, .sidebar-menu li button.active {
      background: rgba(79, 70, 229, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .sidebar-delete-wrap {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .sidebar-delete-btn {
      width: 100%;
    }

    .content-area {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    .page-title { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .page-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .stat-card h4 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .stat-card .stat-number { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .card-item {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-published { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .badge-draft { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }

    .success-text {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      border: 1px solid var(--success);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-box {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    .modal-box h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .modal-box p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-danger {
      background: #DC2626;
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-danger:hover {
      background: #B91C1C;
    }

    @media (max-width: 850px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="main-layout">
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><button id="tab-all" class="active" onclick="setTab('all-courses')">📚 All Courses</button></li>
        <li><button id="tab-add" onclick="setTab('add-course')">➕ Add New Course</button></li>
        <li><button id="tab-update" onclick="setTab('update-course')">✏️ Update Courses</button></li>
        <li><button id="tab-prog" onclick="setTab('progress')">📊 Course Progress</button></li>
        <li><button id="tab-prof" onclick="setTab('profile')">👤 Instructor Profile</button></li>
      </ul>

      <div class="sidebar-delete-wrap">
        <button class="btn-danger sidebar-delete-btn" onclick="openDeleteModal()">🗑 Delete Account</button>
      </div>
    </aside>

    <main class="content-area" id="content-view"></main>
  </div>

  <div id="footer"></div>

  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="enrollments.js"></script>

  <script>
    const COURSES_API = "http://localhost:5000/api/courses/";
    let currentTab = 'all-courses';
    let instructorCourses = [];
    let loading = true;

    async function fetchInstructorCourses() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      loading = true;
      renderContent();

      try {
        const res = await fetch(COURSES_API, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        const data = await res.json();
        const all = data.data || data || [];
        
        instructorCourses = all.map(c => ({
          id: c._id || c.id,
          title: c.title || "Untitled Course",
          category: c.category || "General",
          description: c.description || "",
          status: c.status || "published",
          students: c.studentsCount || 0
        }));
      } catch (err) {
        console.error("Instructor courses fetch failed:", err);
      } finally {
        loading = false;
        renderContent();
      }
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.sidebar-menu button').forEach(b => b.classList.remove('active'));
      if (tab === 'all-courses') document.getElementById('tab-all').classList.add('active');
      if (tab === 'add-course') document.getElementById('tab-add').classList.add('active');
      if (tab === 'update-course') document.getElementById('tab-update').classList.add('active');
      if (tab === 'progress') document.getElementById('tab-prog').classList.add('active');
      if (tab === 'profile') document.getElementById('tab-prof').classList.add('active');
      renderContent();
    }

    function renderContent() {
      const view = document.getElementById('content-view');

      if (loading && currentTab === 'all-courses') {
        view.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 3rem;">Loading instructor courses from server...</p>`;
        return;
      }

      if (currentTab === 'all-courses') {
        view.innerHTML = `
          <h1 class="page-title">Manage All Courses</h1>
          <p class="page-desc">Filter and manage all your published and unpublished course modules.</p>

          <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
            <input type="text" id="course-search" class="form-group" style="flex:1; margin:0;" placeholder="Search courses by title..." oninput="filterCourses()">
            <select id="status-filter" style="width: auto;" onchange="filterCourses()">
              <option value="all">All Courses</option>
              <option value="published">Published</option>
              <option value="unpublished">Unpublished (Draft)</option>
            </select>
          </div>

          <div id="course-list-container"></div>
        `;
        filterCourses();
      } else if (currentTab === 'add-course') {
        view.innerHTML = `
          <h1 class="page-title">Add New Course</h1>
          <p class="page-desc">Create a new course curriculum and publish it for students.</p>
          <form onsubmit="handleCreateCourse(event)">
            <div class="form-group"><label>Course Title</label><input type="text" id="new-title" placeholder="e.g. Master React & Node.js" required></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group"><label>Category</label><input type="text" id="new-category" placeholder="Web Development" required></div>
              <div class="form-group">
                <label>Status</label>
                <select id="new-status">
                  <option value="published">Published</option>
                  <option value="unpublished">Save as Draft (Unpublished)</option>
                </select>
              </div>
            </div>
            <div class="form-group"><label>Description</label><textarea id="new-desc" rows="3" placeholder="Course outline..." required></textarea></div>
            <button type="submit" class="btn-primary" id="btn-create">Create Course</button>
          </form>
        `;
      } else if (currentTab === 'update-course') {
        view.innerHTML = `
          <h1 class="page-title">Update Course</h1>
          <p class="page-desc">Modify existing course content and visibility.</p>
          ${instructorCourses.length === 0 ? '<p style="color:var(--text-muted);">No courses available to update. Please add a course first.</p>' : `
             <form onsubmit="handleUpdateCourse(event)">
               <div class="form-group">
                 <label>Select Course</label>
                 <select id="select-update">${instructorCourses.map(c => `<option value="${c.id}">${c.title} (${c.status})</option>`).join('')}</select>
               </div>
               <div class="form-group"><label>Update Title</label><input type="text" id="edit-title" value="${instructorCourses[0]?.title || ''}"></div>
               <div class="form-group">
                 <label>Status</label>
                 <select id="edit-status"><option value="published">Published</option><option value="unpublished">Unpublished</option></select>
               </div>
               <p id="updateSuccess" class="success-text" hidden></p>
               <button type="submit" class="btn-primary">Save Changes</button>
             </form>
          `}
        `;
      } else if (currentTab === 'progress') {
        view.innerHTML = `
          <h1 class="page-title">Courses Progress & Analytics</h1>
          <p class="page-desc">Student enrollment and completion rate analytics.</p>
          <div class="stats-grid">
            <div class="stat-card"><h4>Total Created Courses</h4><div class="stat-number">${instructorCourses.length}</div></div>
            <div class="stat-card"><h4>Active Instructors</h4><div class="stat-number">1</div></div>
          </div>
          <h3 style="margin-bottom: 1rem;">Created Courses Overview</h3>
          <div id="instructor-progress-list"></div>
        `;
        renderInstructorProgress();
      } else if (currentTab === 'profile') {
        const username = localStorage.getItem('username') || 'Instructor';
        const userEmail = localStorage.getItem('email') || 'instructor@skillforge.com';
        const userId = localStorage.getItem('userId');

        view.innerHTML = `
          <h1 class="page-title">Instructor Profile</h1>
          <p class="page-desc">Manage your public bio and teaching credentials.</p>
          <p id="profileSuccess" class="success-text" hidden></p>
          <form onsubmit="handleInstructorProfileSave(event)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group"><label>Full Name</label><input type="text" value="${username}" required></div>
              <div class="form-group"><label>Email Address</label><input type="email" value="${userEmail}" required></div>
            </div>
            <div class="form-group"><label>Headline</label><input type="text" value="Senior Web Development Instructor"></div>
            <div class="form-group"><label>Bio</label><textarea rows="4">Delivering quality programming courses on SkillForge.</textarea></div>
            <button type="submit" class="btn-primary">Save Profile</button>
          </form>
        `;
      }
    }

    function filterCourses() {
      const search = (document.getElementById('course-search')?.value || '').toLowerCase();
      const status = document.getElementById('status-filter')?.value || 'all';
      const container = document.getElementById('course-list-container');
      if (!container) return;

      const filtered = instructorCourses.filter(c => {
        const matchesSearch = (c.title || '').toLowerCase().includes(search);
        const matchesStatus = status === 'all' || c.status === status;
        return matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No courses available matching criteria.</p>`;
        return;
      }

      container.innerHTML = filtered.map(c => `
        <div class="card-item" style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <span class="badge ${c.status==='published'?'badge-published':'badge-draft'}">${c.status}</span>
            <h3 style="margin-top:0.3rem;">${c.title}</h3>
            <p style="color:var(--text-muted); font-size:0.85rem;">Category: ${c.category}</p>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn-secondary" onclick="setTab('update-course')">Edit</button>
          </div>
        </div>
      `).join('');
    }

    async function handleCreateCourse(e) {
      e.preventDefault();
      const token = localStorage.getItem("token");
      const title = document.getElementById('new-title').value;
      const category = document.getElementById('new-category').value;
      const status = document.getElementById('new-status').value;
      const description = document.getElementById('new-desc').value;
      const btn = document.getElementById('btn-create');

      btn.disabled = true;
      btn.textContent = "Creating...";

      try {
        const res = await fetch(COURSES_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ title, category, status, description })
        });

        if (!res.ok) throw new Error("Failed to create course");

        const view = document.getElementById('content-view');
        const successEl = document.createElement('p');
        successEl.className = 'success-text';
        successEl.textContent = 'Course created successfully!';
        view.insertBefore(successEl, view.firstChild);

        fetchInstructorCourses();
        setTab('all-courses');
      } catch (err) {
        const view = document.getElementById('content-view');
        const errorEl = document.createElement('p');
        errorEl.className = 'error-text';
        errorEl.textContent = err.message || "Error creating course";
        view.insertBefore(errorEl, view.firstChild);
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Course";
      }
    }

    async function renderInstructorProgress() {
      const container = document.getElementById('instructor-progress-list');
      if (!container || !instructorCourses.length) {
        if (container) container.innerHTML = '<p style="color:var(--text-muted);">No courses yet.</p>';
        return;
      }

      container.innerHTML = '<p style="color:var(--text-muted);">Loading progress...</p>';

      try {
        const results = await Promise.all(
          instructorCourses.map(async (c) => {
            const students = await getStudentsProgressForCourse(c.id).catch(() => []);
            return { ...c, students };
          })
        );

        container.innerHTML = results.map((c) => {
          const studentRows = c.students.map((s) => `
            <div class="card-item" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
              <div>
                <strong>${s.student?.name || 'Student'}</strong>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.2rem;">${s.student?.email || ''}</p>
              </div>
              <div style="text-align:right;">
                <span style="color:var(--accent); font-weight:600;">${s.percentage}%</span>
                <p style="color:var(--text-muted); font-size:0.8rem;">${s.completed_lessons}/${s.total_lessons} lessons</p>
              </div>
            </div>
          `).join('');

          return `
            <div class="card-item" style="margin-bottom: 1.5rem;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
                <strong>${c.title}</strong>
                <span class="badge ${c.status==='published'?'badge-published':'badge-draft'}">${c.status}</span>
              </div>
              ${studentRows || '<p style="color:var(--text-muted); font-size:0.85rem;">No enrolled students yet.</p>'}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted);">Failed to load progress.</p>';
      }
    }

    function handleInstructorProfileSave(e) {
      e.preventDefault();
      const successEl = document.getElementById("profileSuccess");
      successEl.textContent = "Instructor profile saved!";
      successEl.hidden = false;
    }

    function handleUpdateCourse(e) {
      e.preventDefault();
      const select = document.getElementById('select-update');
      const titleInput = document.getElementById('edit-title');
      const statusInput = document.getElementById('edit-status');
      if (!select || !titleInput) return;

      const selectedOption = select.options[select.selectedIndex];
      const courseId = select.value;
      const course = instructorCourses.find(c => c.id == courseId);
      if (course) {
        course.title = titleInput.value;
        course.status = statusInput.value;
        const successEl = document.getElementById("updateSuccess");
        if (successEl) {
          successEl.textContent = "Course updated successfully!";
          successEl.hidden = false;
        }
        fetchInstructorCourses();
        setTab('all-courses');
      }
    }

    function openDeleteModal() {
      document.getElementById("deleteModal").hidden = false;
    }

    function closeDeleteModal() {
      document.getElementById("deleteModal").hidden = true;
    }

    async function confirmDeleteAccount() {
      const userId = localStorage.getItem("userId");
      if (!userId) return;

      try {
        await deleteAccount(userId);
        closeDeleteModal();
        logoutUser();
        window.location.href = "index.html";
      } catch (err) {
        const view = document.getElementById('content-view');
        const errorEl = document.createElement('p');
        errorEl.className = 'error-text';
        errorEl.textContent = err.message || "Failed to delete account.";
        if (view) view.insertBefore(errorEl, view.firstChild);
      }
    }

    function logoutUser() {
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      localStorage.removeItem("userId");
      localStorage.removeItem("name");
      localStorage.removeItem("avatar");
      localStorage.removeItem("username");
      localStorage.removeItem("email");
    }

    fetchInstructorCourses();
  </script>

  <div id="deleteModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3>Delete Account</h3>
      <p>This action is permanent and cannot be undone. All your data will be removed.</p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDeleteAccount()">Delete Account</button>
      </div>
    </div>
  </div>

</body>
</html>
