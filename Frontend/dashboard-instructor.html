<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillForge - Instructor Dashboard</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #334155;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-layout {
      display: flex;
      max-width: 1300px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
      gap: 1.8rem;
      flex: 1;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      height: fit-content;
    }
    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .sidebar-menu li button {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: 0.2s;
    }
    .sidebar-menu li button:hover, .sidebar-menu li button.active {
      background: rgba(79, 70, 229, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .content-area {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    .page-title { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .page-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .stat-card h4 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .stat-card .stat-number { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .card-item {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-published { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .badge-draft { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }

    @media (max-width: 850px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Global Navbar Component Placeholder -->
  <div id="navbar"></div>

  <div class="main-layout">
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><button id="tab-all" class="active" onclick="setTab('all-courses')">📚 All Courses</button></li>
        <li><button id="tab-add" onclick="setTab('add-course')">➕ Add New Course</button></li>
        <li><button id="tab-update" onclick="setTab('update-course')">✏️ Update Courses</button></li>
        <li><button id="tab-prog" onclick="setTab('progress')">📊 Course Progress</button></li>
        <li><button id="tab-prof" onclick="setTab('profile')">👤 Instructor Profile</button></li>
      </ul>
    </aside>

    <main class="content-area" id="content-view"></main>
  </div>

  <!-- Global Footer Component Placeholder -->
  <div id="footer"></div>

  <script>
    let currentTab = 'all-courses';

    let instructorCourses = [
      { id: 1, title: 'Web Development Basics', category: 'Development', status: 'published', students: 28, progress: '85%' },
      { id: 2, title: 'Full-Stack Node.js & MongoDB', category: 'Backend', status: 'published', students: 20, progress: '60%' },
      { id: 3, title: 'Advanced Docker & Kubernetes Deployment', category: 'DevOps', status: 'unpublished', students: 0, progress: '0%' }
    ];

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.sidebar-menu button').forEach(b => b.classList.remove('active'));
      if (tab === 'all-courses') document.getElementById('tab-all').classList.add('active');
      if (tab === 'add-course') document.getElementById('tab-add').classList.add('active');
      if (tab === 'update-course') document.getElementById('tab-update').classList.add('active');
      if (tab === 'progress') document.getElementById('tab-prog').classList.add('active');
      if (tab === 'profile') document.getElementById('tab-prof').classList.add('active');
      renderContent();
    }

    function renderContent() {
      const view = document.getElementById('content-view');

      if (currentTab === 'all-courses') {
        view.innerHTML = `
          <h1 class="page-title">Manage All Courses</h1>
          <p class="page-desc">Filter and manage all your published and unpublished course modules.</p>

          <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
            <input type="text" id="course-search" class="form-group" style="flex:1; margin:0;" placeholder="Search courses by title..." oninput="filterCourses()">
            <select id="status-filter" style="width: auto;" onchange="filterCourses()">
              <option value="all">All Courses</option>
              <option value="published">Published</option>
              <option value="unpublished">Unpublished (Draft)</option>
            </select>
          </div>

          <div id="course-list-container"></div>
        `;
        filterCourses();
      } else if (currentTab === 'add-course') {
        view.innerHTML = `
          <h1 class="page-title">Add New Course</h1>
          <p class="page-desc">Create a new course curriculum and publish it for students.</p>
          <form onsubmit="handleCreateCourse(event)">
            <div class="form-group"><label>Course Title</label><input type="text" id="new-title" placeholder="e.g. Master React & Redux" required></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group"><label>Category</label><input type="text" id="new-category" placeholder="Web Development" required></div>
              <div class="form-group">
                <label>Status</label>
                <select id="new-status">
                  <option value="published">Published</option>
                  <option value="unpublished">Save as Draft (Unpublished)</option>
                </select>
              </div>
            </div>
            <div class="form-group"><label>Description</label><textarea id="new-desc" rows="3" placeholder="Course outline..." required></textarea></div>
            <button type="submit" class="btn-primary">Create Course</button>
          </form>
        `;
      } else if (currentTab === 'update-course') {
        view.innerHTML = `
          <h1 class="page-title">Update Course</h1>
          <p class="page-desc">Modify existing course content and visibility.</p>
          <form onsubmit="event.preventDefault(); alert('Course details updated successfully!'); setTab('all-courses');">
            <div class="form-group">
              <label>Select Course</label>
              <select>${instructorCourses.map(c => `<option>${c.title} (${c.status})</option>`).join('')}</select>
            </div>
            <div class="form-group"><label>Update Title</label><input type="text" value="${instructorCourses[0].title}"></div>
            <div class="form-group">
              <label>Status</label>
              <select><option value="published">Published</option><option value="unpublished">Unpublished</option></select>
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
          </form>
        `;
      } else if (currentTab === 'progress') {
        view.innerHTML = `
          <h1 class="page-title">Courses Progress & Analytics</h1>
          <p class="page-desc">Student enrollment and completion rate analytics.</p>
          <div class="stats-grid">
            <div class="stat-card"><h4>Total Students</h4><div class="stat-number">48</div></div>
            <div class="stat-card"><h4>Avg Completion</h4><div class="stat-number">72.5%</div></div>
            <div class="stat-card"><h4>Certificates Issued</h4><div class="stat-number">19</div></div>
          </div>
          <h3 style="margin-bottom: 1rem;">Course Enrollment Stats</h3>
          ${instructorCourses.map(c => `
            <div class="card-item" style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <strong>${c.title}</strong>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.2rem;">${c.students} Active Learners • Status: ${c.status.toUpperCase()}</p>
              </div>
              <span style="color:var(--accent); font-weight:700;">${c.progress} Completed</span>
            </div>
          `).join('')}
        `;
      } else if (currentTab === 'profile') {
        view.innerHTML = `
          <h1 class="page-title">Instructor Profile</h1>
          <p class="page-desc">Manage your public bio and teaching credentials.</p>
          <form onsubmit="event.preventDefault(); alert('Instructor profile saved!');">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group"><label>Full Name</label><input type="text" value="Dr. Sarah Jenkins"></div>
              <div class="form-group"><label>Email Address</label><input type="email" value="sarah.jenkins@skillforge.com"></div>
            </div>
            <div class="form-group"><label>Headline</label><input type="text" value="Lead Full-Stack Instructor & Software Architect"></div>
            <div class="form-group"><label>Bio</label><textarea rows="4">Passionate educator with 8+ years building enterprise applications on modern web stacks.</textarea></div>
            <button type="submit" class="btn-primary">Save Profile</button>
          </form>
        `;
      }
    }

    function filterCourses() {
      const search = (document.getElementById('course-search')?.value || '').toLowerCase();
      const status = document.getElementById('status-filter')?.value || 'all';
      const container = document.getElementById('course-list-container');
      if (!container) return;

      const filtered = instructorCourses.filter(c => {
        const matchesSearch = c.title.toLowerCase().includes(search);
        const matchesStatus = status === 'all' || c.status === status;
        return matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No courses match your filter.</p>`;
        return;
      }

      container.innerHTML = filtered.map(c => `
        <div class="card-item" style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <span class="badge ${c.status==='published'?'badge-published':'badge-draft'}">${c.status}</span>
            <h3 style="margin-top:0.3rem;">${c.title}</h3>
            <p style="color:var(--text-muted); font-size:0.85rem;">Category: ${c.category} • ${c.students} Students</p>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn-secondary" onclick="setTab('update-course')">Edit</button>
            <button class="btn-primary" onclick="c.status=c.status==='published'?'unpublished':'published'; filterCourses();">
              ${c.status==='published'?'Unpublish':'Publish'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function handleCreateCourse(e) {
      e.preventDefault();
      instructorCourses.push({
        id: Date.now(),
        title: document.getElementById('new-title').value,
        category: document.getElementById('new-category').value,
        status: document.getElementById('new-status').value,
        students: 0,
        progress: '0%'
      });
      alert('Course created successfully!');
      setTab('all-courses');
    }

    renderContent();
  </script>
</body>
</html>
